name: Deploy Backend to Render

on:
  push:
    branches:
      - backend-pages
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (excluding integration tests)
        run: |
          # Run all tests except those requiring integration build tag
          go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v /pkg/clients)
          
      - name: Run integration tests (optional)
        if: vars.VBANK_BASE_URL != ''
        env:
          VBANK_BASE_URL: ${{ vars.VBANK_BASE_URL }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          CLIENT_SECRET: ${{ vars.CLIENT_SECRET }}
        run: go test -v -tags=integration ./pkg/clients/...
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
        continue-on-error: true

  build:
    name: Build Binary
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server -ldflags="-s -w" cmd/main.go
          ls -lh bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/server

  deploy:
    name: Deploy to Timeweb Cloud
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/backend-pages'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: ./bin

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TIMEWEB_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.TIMEWEB_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          mkdir -p deploy_package
          cp bin/server deploy_package/
          cp -r backend/config deploy_package/
          cp backend/deploy/deploy.sh deploy_package/
          cp backend/.env.example deploy_package/.env.example
          # Note: migrations are embedded in binary (internal/app/migrations/)
          chmod +x deploy_package/server
          chmod +x deploy_package/deploy.sh

      - name: Prepare server directory
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          USERNAME: ${{ secrets.TIMEWEB_USERNAME }}
          APP_DIR: ${{ secrets.TIMEWEB_APP_DIR }}
        run: |
          echo "📁 Preparing server directory..."
          ssh $USERNAME@$HOST "mkdir -p $APP_DIR/{config,backups,logs} && chmod -R 755 $APP_DIR"

      - name: Deploy to Timeweb Cloud
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          USERNAME: ${{ secrets.TIMEWEB_USERNAME }}
          APP_DIR: ${{ secrets.TIMEWEB_APP_DIR }}
        run: |
          # Upload files
          echo "📤 Uploading files to server..."
          scp deploy_package/server $USERNAME@$HOST:$APP_DIR/
          scp -r deploy_package/config $USERNAME@$HOST:$APP_DIR/
          scp deploy_package/deploy.sh $USERNAME@$HOST:$APP_DIR/
          scp deploy_package/.env.example $USERNAME@$HOST:$APP_DIR/
          
          # Set permissions
          echo "🔐 Setting permissions..."
          ssh $USERNAME@$HOST "chmod +x $APP_DIR/server $APP_DIR/deploy.sh"
          
          # Run deployment script (without sudo!)
          echo "🚀 Running deployment script..."
          ssh $USERNAME@$HOST "cd $APP_DIR && bash deploy.sh"

      - name: Health check (internal)
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          USERNAME: ${{ secrets.TIMEWEB_USERNAME }}
        run: |
          echo "🏥 Running health check on localhost:8080..."
          sleep 5
          ssh $USERNAME@$HOST "curl -f http://localhost:8080/health || exit 1"
          echo "✅ Backend is healthy!"

      # TODO: Uncomment after setting up Nginx + SSL + DNS
      # - name: Health check (external HTTPS)
      #   run: |
      #     echo "🌐 Checking external endpoint..."
      #     curl -f https://${{ secrets.TIMEWEB_DOMAIN }}/health || exit 1
